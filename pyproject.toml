[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mac-cleanup"
version = "0.1.0"
description = "A transparent filesystem audit and cleanup assistant for macOS."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["macos", "cleanup", "filesystem", "utility", "disk-space"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/kaustubh/mac-cleanup"
Repository = "https://github.com/kaustubh/mac-cleanup"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*", "models*", "report*", "config*", "utils*"]